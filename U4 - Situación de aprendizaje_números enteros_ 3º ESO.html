/* Estilo Cuaderno de Clase Cuadriculado */
:root {
  --paper: #F3F7FC;
  --grid: #DCE6F4;
  --card: #FFFFFF;
  --ink: #15215C;
  --muted: #4F5A86;
  --line: #C5D3EA;
  --primary: #2336A8;
  --on-primary: #FFFFFF;
  --red: #C93A26;
  --red-soft: #FCE9E5;
  --green: #17764E;
  --green-soft: #E3F5EC;
  --amber: #8A5A00;
  --amber-soft: #FBF0D5;
  --blue-cold: #1A73E8;
  --f-display: &quot;Bricolage Grotesque&quot;, &quot;Trebuchet MS&quot;, system-ui, sans-serif;
  --f-body: &quot;Atkinson Hyperlegible&quot;, &quot;Segoe UI&quot;, system-ui, sans-serif;
  --f-mono: &quot;IBM Plex Mono&quot;, ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=&quot;light&quot;]) {
    --paper: #0F1634; --grid: #19224D; --card: #16204A; --ink: #E7ECFF; --muted: #A5B0DC;
    --line: #2C3A74; --primary: #94A6FF; --on-primary: #0F1634; --red: #FF8470; --red-soft: #3A1F2A;
    --green: #5BD9A2; --green-soft: #173A33; --amber: #F2C063; --amber-soft: #38300F; --blue-cold: #64B5F6;
    color-scheme: dark;
  }
}
:root[data-theme=&quot;dark&quot;] {
  --paper: #0F1634; --grid: #19224D; --card: #16204A; --ink: #E7ECFF; --muted: #A5B0DC;
  --line: #2C3A74; --primary: #94A6FF; --on-primary: #0F1634; --red: #FF8470; --red-soft: #3A1F2A;
  --green: #5BD9A2; --green-soft: #173A33; --amber: #F2C063; --amber-soft: #38300F; --blue-cold: #64B5F6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.5;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: &quot;&quot;; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--card); z-index: 30; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
sup, sub { font-size: .75em; line-height: 0; }
.wrap { max-width: 760px; margin-inline: auto; }

/* Cabecera fija */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 2px solid var(--ink); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: -.01em; }
.who { font-size: 14px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.who b { color: var(--ink); }
.spacer { flex: 1 1 auto; }
.bar { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.track { flex: 1; height: 12px; border: 2px solid var(--ink); border-radius: 99px; background: var(--paper); overflow: hidden; }
.fill { height: 100%; background: var(--primary); width: 0; transition: width .35s ease; }
.pct { font-family: var(--f-mono); font-weight: 600; font-size: 14px; min-width: 7.5ch; text-align: right; font-variant-numeric: tabular-nums; }

.btn { border: 2px solid var(--ink); background: var(--card); border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; min-height: 42px; }
.btn:hover { background: var(--paper); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.08); background: var(--primary); }
.btn.small { min-height: 34px; padding: 4px 10px; font-size: 15px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.ghost { border-color: var(--line); font-weight: 400; }

/* Etapas */
.steps { display: flex; gap: 6px; overflow-x: auto; padding: 14px 2px 6px; scrollbar-width: thin; }
.step { flex: 0 0 auto; border: 2px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 700; font-size: 15px; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.step[aria-current=&quot;step&quot;] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.step .n { font-family: var(--f-mono); font-size: 13px; opacity: .8; font-variant-numeric: tabular-nums; }
.step .ok { color: var(--green); font-weight: 800; }
.step[aria-current=&quot;step&quot;] .ok { color: var(--paper); }

main { display: flex; flex-direction: column; gap: 18px; padding-top: 14px; }
.sheet { background: var(--card); border: 2px solid var(--ink); border-radius: 10px; padding: 18px; min-width: 0; }
.sheet.story { background: var(--amber-soft); border-color: var(--amber); }
.eyebrow { font-family: var(--f-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-size: clamp(28px, 6.5vw, 42px); font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: clamp(22px, 4.8vw, 30px); font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 19px; font-weight: 800; }
.lead { color: var(--muted); font-size: 17px; max-width: 62ch; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Entrada */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; }
.field input, .field select { border: 2px solid var(--ink); border-radius: 8px; padding: 10px 12px; background: var(--paper); min-height: 46px; width: 100%; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: 13px; border: 1.5px solid var(--line); border-radius: 6px; padding: 2px 7px; background: var(--paper); font-weight: 500; }
.err { color: var(--red); font-weight: 700; min-height: 1.5em; }

/* Actividades */
.card { background: var(--card); border: 2px solid var(--ink); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.done-ok { border-color: var(--green); }
.card.done-fail { border-color: var(--red); }
.card-head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.tag { font-family: var(--f-mono); font-size: 13px; font-weight: 600; background: var(--ink); color: var(--paper); border-radius: 5px; padding: 2px 8px; }
.tag.self { background: var(--amber-soft); color: var(--amber); border: 1.5px solid var(--amber); }
.crit-text { font-size: 14px; color: var(--muted); }
.crit-text summary { cursor: pointer; font-weight: 700; color: var(--ink); }
.prompt { max-width: 64ch; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: var(--paper); }
.opt:has(input:checked) { border-color: var(--primary); background: var(--card); box-shadow: inset 0 0 0 1px var(--primary); }
.opt input { margin-top: 5px; accent-color: var(--primary); width: 18px; height: 18px; flex: 0 0 auto; }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.numrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.num { font-family: var(--f-mono); font-weight: 600; font-size: 20px; border: 2px solid var(--ink); border-radius: 8px; padding: 8px 12px; width: 9.5em; max-width: 100%; background: var(--paper); font-variant-numeric: tabular-nums; }
.num.right { border-color: var(--green); background: var(--green-soft); }
.num.wrong { border-color: var(--red); background: var(--red-soft); }
.unit { color: var(--muted); font-weight: 600; }
.tbl { display: grid; grid-template-columns: minmax(110px, 1fr) minmax(120px, 1.2fr); gap: 8px 12px; align-items: center; }
.tbl .lab { font-weight: 700; }
.given { font-family: var(--f-mono); font-weight: 600; font-size: 18px; padding: 8px 12px; border: 2px dashed var(--line); border-radius: 8px; background: var(--paper); }
.tbl .num { width: 100%; }
textarea.say { width: 100%; min-height: 130px; border: 2px solid var(--ink); border-radius: 8px; padding: 10px 12px; background: var(--paper); resize: vertical; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fb { border-radius: 8px; padding: 10px 12px; font-size: 16px; border: 2px solid transparent; }
.fb.ok { background: var(--green-soft); border-color: var(--green); }
.fb.no { background: var(--red-soft); border-color: var(--red); }
.fb.hint { background: var(--amber-soft); border-color: var(--amber); }
.fb b.mark { font-family: var(--f-display); }
.fb ul { margin: 6px 0 0; padding-left: 20px; }
.score { font-family: var(--f-mono); font-weight: 600; font-size: 14px; color: var(--muted); }

/* Termómetro Interactivo SVG */
.thermo-box { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center; background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; padding: 14px; }
@media (max-width: 520px) { .thermo-box { grid-template-columns: 1fr; } }
.thermo-svg { width: 100px; height: 220px; margin: auto; }
.thermo-controls { display: flex; flex-direction: column; gap: 12px; }
.readout { font-family: var(--f-mono); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }

.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 4px; }

/* Informe */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { border: 2px solid var(--line); border-radius: 8px; padding: 12px; background: var(--paper); }
.kpi .v { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 14px; color: var(--muted); }
.crit-list { display: flex; flex-direction: column; gap: 14px; }
.crit { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.crit .desc { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
.meter { grid-column: 1 / -1; height: 10px; border-radius: 99px; background: var(--paper); border: 1.5px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--primary); }
.meter i.low { background: var(--red); }
.meter i.mid { background: var(--amber); }
.meter i.high { background: var(--green); }
.lvl { font-family: var(--f-mono); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.tscroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; min-width: 520px; }
th, td { border-bottom: 1.5px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.m { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-weight: 700; z-index: 40; max-width: calc(100% - 32px); }
.note { font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }

/* ---------- Informe PDF jsPDF ---------- */
function safe(t) {
  return String(t || &quot;&quot;).replace(/&lt;br\s*\/?&gt;/g, &quot; &quot;).replace(/&lt;[^&gt;]+&gt;/g, &quot;&quot;)
    .replace(/°/g, &quot; deg &quot;).replace(/Δ/g, &quot;Delta &quot;).replace(/±/g, &quot;+/-&quot;).replace(/–|—/g, &quot;-&quot;).replace(/…/g, &quot;...&quot;).replace(/·/g, &quot;x&quot;);
}
function slug(t) { return t.normalize(&quot;NFD&quot;).replace(/[\u0300-\u036f]/g, &quot;&quot;).toLowerCase().replace(/[^a-z0-9]+/g, &quot;_&quot;).replace(/^_|_$/g, &quot;&quot;) || &quot;alumno&quot;; }

function summaryText() {
  var p = progress(), o = overall(), t = [&quot;El laboratorio bajo cero - Matemáticas 3º ESO&quot;, &quot;I.E.S. Ntra. Sra. de la Cabeza - Andújar (2026/2027)&quot;, S.student.name + &quot; - &quot; + S.student.course + &quot; - &quot; + new Date().toLocaleDateString(&quot;es-ES&quot;), &quot;Progreso: &quot; + p.done + &quot; de &quot; + p.total + &quot; actividades&quot;, &quot;Nota media por criterios: &quot; + (o === null ? &quot;sin calificar&quot; : fmt(o) + &quot; / 10 (&quot; + level(o)[0] + &quot;)&quot;), &quot;&quot;];
  critScores().forEach(function (c) { t.push(c.code + &quot;: &quot; + (c.score === null ? &quot;sin hacer&quot; : fmt(c.score) + &quot; / 10&quot;)); });
  var e = A(&quot;E1&quot;); if (e.done) t.push(&quot;&quot;, &quot;Explicación técnica: &quot; + e.value);
  return t.join(&quot;\n&quot;);
}

function copySummary() {
  var t = summaryText();
  var fail = function () { var ta = $(&quot;sumtxt&quot;); if (ta) { ta.hidden = false; ta.value = t; ta.focus(); ta.select(); } toast(&quot;Copia el texto seleccionado.&quot;); };
  try { navigator.clipboard.writeText(t).then(function () { toast(&quot;Resumen copiado al portapapeles.&quot;); }, fail); } catch (e) { fail(); }
}

async function makePdf() {
  if (!S.student) { toast(&quot;Identifícate primero para generar el informe.&quot;); return; }
