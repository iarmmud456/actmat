<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Enigma del Matemático Fantasma · Escape Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Creepster&family=IM+Fell+English:ital@0;1&display=swap">
<style>
:root{--bg:#0b0c10;--bg2:#1f2833;--tx:#d5dbe0;--mut:#8a97a3;--red:#ff2a4d;--grn:#39ff88;--card:rgba(31,40,51,.82);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,var(--bg2) 0%,var(--bg) 70%) fixed;color:var(--tx);font-family:'IM Fell English',Georgia,'Times New Roman',serif;font-size:1.08rem;line-height:1.5;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(ellipse 40% 25% at 20% 70%,rgba(180,200,210,.10),transparent 70%),radial-gradient(ellipse 45% 22% at 80% 85%,rgba(160,190,180,.10),transparent 70%);animation:fog 28s linear infinite alternate}
body::after{animation-duration:40s;animation-direction:alternate-reverse;opacity:.8}
@keyframes fog{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
.vig{position:fixed;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 160px 40px #000}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,12,16,.94);border-bottom:1px solid #2b3a47;padding:10px 14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font:400 1.2rem Creepster,Cinzel,Georgia,serif;margin:0;color:var(--red);letter-spacing:.08em;text-shadow:0 0 8px var(--red);animation:fl 5s infinite}
@keyframes fl{0%,92%,100%{opacity:1}93%{opacity:.4}95%{opacity:1}97%{opacity:.5}}
.bar{height:10px;background:#12171d;border:1px solid #2b3a47;border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0a8f4a,var(--grn));box-shadow:0 0 10px var(--grn);transition:width .6s}
.meta{font-size:.82rem;color:var(--mut);font-family:system-ui,sans-serif}
main{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border:1px solid #2b3a47;border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 10px 40px #000a}
.card.ok{animation:gl 1s}.card.bad{animation:sh .4s}
@keyframes gl{0%{box-shadow:0 0 0 0 var(--grn)}40%{box-shadow:0 0 40px 6px var(--grn)}100%{box-shadow:0 10px 40px #000a}}
@keyframes sh{20%,60%{transform:translateX(-6px);box-shadow:0 0 30px var(--red)}40%,80%{transform:translateX(6px)}}
h2{margin:0 0 4px;color:var(--grn);text-shadow:0 0 8px #39ff8866;font:400 1.9rem Creepster,Cinzel,Georgia,serif;letter-spacing:.05em}
h3{margin:0 0 8px;color:var(--red);font:700 .95rem Cinzel,Georgia,serif;letter-spacing:.08em}
.sub{color:var(--mut);font-style:italic;margin:0 0 10px}
.q{font-size:1.15rem;margin:8px 0 14px}
input[type=text],textarea,select{width:100%;background:#0b0c10;color:var(--grn);border:1px solid #2b3a47;border-radius:8px;padding:10px 12px;font:1.1rem ui-monospace,Consolas,monospace}
input:focus,textarea:focus{outline:none;border-color:var(--grn);box-shadow:0 0 10px #39ff8866}
textarea{font-size:.8rem;min-height:90px;color:var(--tx)}
button{font:700 .88rem Cinzel,system-ui,sans-serif;cursor:pointer;border-radius:8px;border:1px solid var(--grn);background:#0b0c10;color:var(--grn);padding:10px 16px;margin:8px 8px 0 0;transition:.2s}
button:hover{background:var(--grn);color:#000;box-shadow:0 0 14px var(--grn)}
button.r{border-color:var(--red);color:var(--red)}button.r:hover{background:var(--red);color:#fff;box-shadow:0 0 14px var(--red)}
button.s{border-color:#4a5b6a;color:var(--mut);font-size:.82rem;padding:6px 10px;margin:0}
.msg{margin-top:12px;min-height:1.4em;font-family:system-ui,sans-serif}
.g{color:var(--grn)}.rd{color:var(--red)}
.hint{border-left:3px solid var(--red);padding:6px 10px;margin-top:10px;color:#ffb3c0;background:#ff2a4d14}
table{width:100%;border-collapse:collapse;font:.88rem system-ui,sans-serif;margin-top:8px}
td,th{padding:6px;border-bottom:1px solid #2b3a47;text-align:left}
label{display:block;margin:10px 0 4px;color:var(--mut);font:.85rem system-ui,sans-serif}
.hide{display:none}
.opt label{display:flex;gap:8px;align-items:flex-start;color:var(--tx);margin:6px 0}
.opt input{margin-top:5px}
.scene{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:10px 14px 0}
.scene svg{width:100%;height:auto;display:block;border-radius:10px;border:1px solid #2b3a47;box-shadow:0 10px 40px #000}
#qc{border-color:#2fd6ff88;background:linear-gradient(160deg,rgba(20,70,90,.5),rgba(10,40,45,.6));box-shadow:0 0 30px #2fd6ff33,inset 0 0 40px #2fd6ff14}
#qc .q{font-size:1.3rem;color:#bff6ff;text-shadow:0 0 8px #2fd6ff88}
.dust span{position:fixed;left:0;width:3px;height:3px;border-radius:50%;background:#ffd89a;opacity:.5;z-index:1;pointer-events:none;animation:dr 14s linear infinite}
@keyframes dr{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}
.flick{animation:fk 3s infinite alternate}@keyframes fk{50%{opacity:.7}}
#hero{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:10px;border:1px solid #2b3a47;box-shadow:0 10px 40px #000;transition:aspect-ratio .6s}
.play #hero{aspect-ratio:21/7;object-position:50% 13%}
#fx{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
#fx>div{position:absolute}
.gh{font-size:3.2rem;opacity:0;filter:drop-shadow(0 0 12px #bff6ff);animation:gh 9s linear forwards}
@keyframes gh{0%{transform:translate(-15vw,0);opacity:0}10%{opacity:.55}50%{transform:translate(50vw,-30px)}90%{opacity:.4}100%{transform:translate(115vw,20px);opacity:0}}
.bt{font-size:2rem;animation:bt 5s ease-in-out forwards}
@keyframes bt{0%{transform:translate(-10vw,0) rotate(0)}25%{transform:translate(25vw,-6vh) rotate(8deg)}50%{transform:translate(55vw,4vh) rotate(-6deg)}75%{transform:translate(85vw,-5vh)}100%{transform:translate(115vw,0)}}
.ey{width:70px;height:34px;opacity:0;animation:ey 3.2s forwards}
.ey::before,.ey::after{content:"";position:absolute;top:11px;width:16px;height:10px;border-radius:50%;background:radial-gradient(#ffe45e 30%,#ff2a4d 70%);box-shadow:0 0 12px #ff2a4d}
.ey::before{left:8px}.ey::after{right:8px}
@keyframes ey{0%{opacity:0}15%,45%{opacity:1}50%{opacity:1;transform:scaleY(.1)}55%{transform:scaleY(1)}80%{opacity:1}100%{opacity:0}}
.sk{bottom:-90px;font-size:4rem;animation:sk 3.4s ease-in-out forwards}
@keyframes sk{0%,100%{transform:translateY(0)}20%,80%{transform:translateY(-85px) rotate(-6deg)}50%{transform:translateY(-85px) rotate(6deg)}}
.sp{top:-20px;width:2px;background:#8a97a3;height:0;animation:sp 4.5s ease-in-out forwards}
.sp::after{content:"🕷";position:absolute;bottom:-18px;left:-9px;font-size:1.3rem}
@keyframes sp{0%,100%{height:0}35%,65%{height:22vh}}
.lt{inset:0;background:#cfe6ff;opacity:0;animation:lt .7s}
@keyframes lt{0%,30%,50%,100%{opacity:0}10%{opacity:.35}35%{opacity:.2}}
.ws{font-size:1.6rem;animation:ws 1.8s ease-out forwards}
@keyframes ws{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-130px) scale(1.4)}}
.hit{pointer-events:auto;cursor:pointer;touch-action:manipulation}
.pk{bottom:6px;font-size:2.4rem;animation:pk 8s linear forwards}
@keyframes pk{from{transform:translateX(-12vw) rotate(0)}to{transform:translateX(112vw) rotate(900deg)}}
.cat{font-size:3rem;top:55vh;right:-70px;animation:cat 4.5s ease-in-out forwards}
@keyframes cat{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-62px)}}
.pt{font:700 1.2rem Cinzel,system-ui,sans-serif;color:#39ff88;text-shadow:0 0 8px #39ff88;animation:ws 1.2s ease-out forwards}
.pop{animation:po .35s forwards!important}
@keyframes po{to{transform:scale(1.8);opacity:0}}
@media(prefers-reduced-motion:reduce){#fx{display:none}}
</style>
</head>

const R=[
{n:'Sala 1 · La Biblioteca Maldita',s:'Operaciones combinadas sin paréntesis',d:`Los libros susurran tu nombre. Aquí manda la jerarquía: primero productos y cocientes, y después sumas y restas.`,k:'📜 Pergamino sellado'},
{n:'Sala 2 · El Laboratorio de Pociones',s:'Operaciones combinadas con paréntesis',d:`Las probetas burbujean. Los paréntesis mandan: resuélvelos antes que nada o la poción estallará.`,k:'🧪 Frasco violeta'},
{n:'Sala 3 · El Pasadizo de los Espejos',s:'Paréntesis, corchetes y jerarquía',d:`Los espejos repiten cada error. Combina paréntesis, corchetes y operaciones sin ellos para romper el cristal.`,k:'🗝️ Llave de hierro'},
{n:'Sala 4 · La Puerta del Amanecer',s:'Problemas con operaciones combinadas',d:`Queda poco para el alba. Traduce cada historia a una operación combinada y abre la última puerta antes de que cante el gallo.`,k:'💀 Cráneo del candado'}];
const Q=[
{c:'3.1',t:`Calcula 1/2 + 1/3 · 3/4`,a:[3,4],h:`Primero el producto: 1/3 · 3/4 = 1/4. Después suma 1/2 + 1/4.`,f:`Sin paréntesis, el producto se hace antes que la suma.`},
{c:'3.1',t:`Calcula 3/2 − 1/4 · 2/3`,a:[4,3],h:`El producto da 2/12 = 1/6. Después resta 3/2 − 1/6.`,f:`Haz primero la multiplicación y luego la resta con común denominador.`},
{c:'3.1',t:`Calcula 2/5 + 3/10 : 3/4`,a:[4,5],h:`Dividir es multiplicar por la inversa: 3/10 · 4/3 = 2/5. Luego suma.`,f:`Primero el cociente, después la suma.`},
{c:'3.1',t:`Calcula 1/2 · 4/3 − 1/6 : 1/2`,a:[1,3],h:`Hay dos operaciones prioritarias: 1/2 · 4/3 = 2/3 y 1/6 : 1/2 = 1/3. Resta al final.`,f:`Resuelve el producto y el cociente por separado antes de restar.`},
{c:'3.1',t:`Calcula (3/4 − 1/6) · 3/7`,a:[1,4],h:`El paréntesis da 7/12. Multiplica por 3/7 y simplifica.`,f:`Empieza por el paréntesis, con común denominador 12.`},
{c:'3.1',t:`Calcula (2/3 + 1/4) : 11/6`,a:[1,2],h:`El paréntesis da 11/12. Dividir entre 11/6 es multiplicar por 6/11.`,f:`Paréntesis primero; después el cociente con la inversa.`},
{c:'3.1',t:`Calcula 5/2 · (1/3 + 1/5)`,a:[4,3],h:`El paréntesis da 8/15. Multiplica 5/2 · 8/15 y simplifica.`,f:`Suma primero lo que hay dentro del paréntesis.`},
{c:'3.1',t:`Calcula (7/4 − 1/2) : 5/8`,a:[2,1],h:`El paréntesis da 5/4. Divide entre 5/8 multiplicando por 8/5.`,f:`Resuelve el paréntesis y luego divide por la inversa. El resultado es un número entero.`},
{c:'3.1',t:`Calcula 2/3 + (3/4 − 1/3) : 5/2`,a:[5,6],h:`El paréntesis da 5/12; el cociente 5/12 : 5/2 = 1/6. Al final suma 2/3 + 1/6.`,f:`Orden: paréntesis, cociente y, por último, la suma.`},
{c:'3.1',t:`Calcula (5/6 − 1/2) · (3/4 + 1/2)`,a:[5,12],h:`Los paréntesis dan 1/3 y 5/4. Multiplícalos.`,f:`Resuelve cada paréntesis por separado antes de multiplicar.`},
{c:'3.1',t:`Calcula 3/4 − 1/2 · (2/3 + 1/6)`,a:[1,3],h:`El paréntesis da 5/6; el producto 1/2 · 5/6 = 5/12. Resta 3/4 − 5/12.`,f:`Paréntesis, después el producto y al final la resta.`},
{c:'3.1',t:`Calcula 1 − [1/2 + (1/3 − 1/4)]`,a:[5,12],h:`Dentro: 1/3 − 1/4 = 1/12. Después 1/2 + 1/12 = 7/12. Resta a 1.`,f:`Empieza por el paréntesis más interior y sigue hacia fuera.`},
{c:'3.2',t:`El pergamino del fantasma mide 5/6 de metro. Se corta 1/4 de metro y el resto se divide en 2 trozos iguales. ¿Cuánto mide cada trozo (en metros)?`,a:[7,24],h:`Se plantea (5/6 − 1/4) : 2. El paréntesis da 7/12.`,f:`Primero lo que queda tras cortar; después se reparte entre 2.`},
{c:'3.2',t:`Una jarra tiene 3/2 de litro. Se llenan 3 copas con 1/4 de litro cada una y luego se beben 1/2 litro. ¿Cuántos litros quedan?`,a:[1,4],h:`Se plantea 3/2 − 3 · 1/4 − 1/2. El producto va primero.`,f:`Calcula cuánto se gasta en las copas antes de restar.`},
{c:'3.2',t:`En el cofre hay 120 monedas: 1/3 son de oro, 1/4 de plata y el resto de cobre. ¿Cuántas son de cobre?`,a:[50,1],h:`Se plantea 120 · (1 − 1/3 − 1/4). El paréntesis es la fracción de cobre.`,f:`Halla la fracción que queda para el cobre y calcula esa parte de 120.`},
{c:'3.2',t:`El matemático reparte su herencia: 1/2 para su ayudante y 1/3 para la biblioteca. De lo que sobra, 3/5 van a la escuela. ¿Qué fracción de la herencia queda sin repartir?`,a:[1,15],h:`Tras los dos primeros repartos queda 1 − 1/2 − 1/3 = 1/6. La escuela recibe 3/5 de 1/6.`,f:`Calcula primero lo que sobra y después la parte de ese resto que se lleva la escuela.`}];
const CR={'3.1':['ACT.3.1 / MAT.3.1','Problemas cotidianos con operaciones combinadas de números racionales'],'3.2':['ACT.3.2','Representación y comparación de fracciones: datos, partes y porcentajes']};
const PQ=0.625,$=id=>document.getElementById(id);
let S={i:0,q:Q.map(()=>[0,0,0,0]),b:0};let fin=false,res=null;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fm=a=>a[1]==1?''+a[0]:a[0]+'/'+a[1];
const pr=s=>{const m=s.trim().match(/^(-?\d+)\s*(?:\/\s*(\d+))?$/);return m?[+m[1],m[2]?+m[2]:1]:null};
const pts=i=>{const[a,h,ok]=S.q[i];return ok?Math.max(0,+(PQ-0.15*(a-1)-0.2*h).toFixed(3)):0};
const mmss=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const tot=()=>S.q.reduce((s,x)=>s+x[3],0);
function bar(){const n=S.q.filter(x=>x[2]).length,p=Math.round(n/Q.length*100);$('pb').style.width=p+'%';$('pp').textContent=(S.b?'Bonus: +'+(Math.min(10,S.b)/10).toFixed(1).replace('.',',')+' · ':'')+'Progreso: '+p+' % ('+n+'/'+Q.length+' pruebas superadas)'+(()=>{const l=R.filter((r,k)=>S.q.slice(k*4,k*4+4).every(x=>x[2])).map(r=>r.k.split(' ')[0]);return l.length?' · Objetos: '+l.join(' '):''})();$('rm').textContent=S.i<Q.length?R[Math.floor(S.i/4)].n:'Salida';}
function intro(){fin=true;document.body.classList.remove('play');$('view').innerHTML=`<div class="card"><h2>El Enigma del Matemático Fantasma</h2><p class="sub">Escape Room individual</p><p>El fantasma de un viejo matemático ha encerrado a sus alumnos en su estudio y solo deja salir a quien domine las <b>operaciones combinadas con fracciones</b>, con y sin paréntesis. Cruza 4 salas para escapar antes del amanecer. Hay 4 pruebas por sala (16 en total) y cada una vale hasta 0,625 puntos: cada reintento resta 0,15 y cada pista opcional 0,20. Escribe las fracciones como <b>a/b</b> y siempre <b>simplificadas</b>.</p><p class="meta">En los enunciados, · es multiplicar y : es dividir. 🔊 Con música y sonidos tenebrosos (mejor con auriculares): el altavoz de la cabecera los silencia.</p><p class="meta">👻 Extra: si tocas las apariciones que cruzan la pantalla (fantasmas, murciélagos, calabazas…) sumas +0,1 puntos cada una, hasta +1 en total.</p><button id="go">Entrar en la mansión</button><button class="r" id="rs">Continuar partida guardada</button></div>`;$('go').onclick=()=>{S.i=0;render()};$('rs').onclick=()=>{$('sv').classList.remove('hide');$('code').focus()};bar();}
function render(){fin=false;document.body.classList.add('play');bar();if(S.i>=Q.length){return form()}
 const i=S.i,q=Q[i],r=R[Math.floor(i/4)],st=S.q[i],first=i%4==0;
 $('view').innerHTML=`${first?`<div class="card"><h2>${r.n}</h2><p class="sub">${r.s}</p><p>${r.d}</p></div>`:''}<div class="card" id="qc"><h3>PRUEBA ${i+1} DE ${Q.length} · ${CR[q.c][0]}</h3><div class="q">${q.t}</div><input type="text" id="ans" autocomplete="off" placeholder="p. ej. 3/5" ${st[2]?'disabled':''}><button id="chk" ${st[2]?'class="hide"':''}>RESOLVER</button><button class="r ${st[2]?'hide':''}" id="hb">PISTA (−0,20)</button><div class="msg" id="fb"></div><div id="hh"></div><button id="nx" class="${st[2]?'':'hide'}">Continuar →</button></div>`;
 $('ans').onkeydown=e=>{if(e.key=='Enter')chk()};$('chk').onclick=chk;$('hb').onclick=hint;$('nx').onclick=()=>{S.i++;render()};if(st[2])okMsg();else if(st[1])hshow();}
function hshow(){$('hh').innerHTML=`<div class="hint">💡 ${Q[S.i].h}</div>`}
function hint(){const st=S.q[S.i];if(!st[1])st[1]=1;hshow()}
function okMsg(){const i=S.i;$('fb').innerHTML=`<span class="g">✔ ¡Correcto! Respuesta: ${fm(Q[i].a)} · +${pts(i).toFixed(2)} pts.${i%4==3?`<br>🚪 La puerta se abre. Obtienes: ${R[Math.floor(i/4)].k}`:''}</span>`}
function chk(){const i=S.i,q=Q[i],st=S.q[i],v=pr($('ans').value),c=$('qc');if(st[2])return;
 if(!v||v[1]==0){$('fb').innerHTML='<span class="rd">Escribe un número o una fracción con el formato a/b.</span>';return}
 const eq=v[0]*q.a[1]==v[1]*q.a[0];
 if(eq&&gcd(v[0],v[1])!=1){$('fb').innerHTML='<span class="rd">Valor correcto, pero la fracción no está simplificada. Reduce y vuelve a intentarlo (no cuenta como intento).</span>';return}
 st[0]++;c.classList.remove('ok','bad');void c.offsetWidth;

$('bload').onclick=()=>{try{const o=JSON.parse(atob($('code').value.trim()));if(o.v!=1||!Array.isArray(o.q)||o.q.length!=Q.length)throw 0;S={i:Math.min(Math.max(+o.i||0,0),Q.length),q:o.q.map(x=>[+x[0]||0,+x[1]||0,x[2]?1:0,+x[3]||0]),b:Math.min(10,Math.max(0,+o.b||0))};$('sv').classList.add('hide');render()}catch(e){$('svm').innerHTML='<span class="rd">Código no válido.</span>'}};
$('bfin').onclick=()=>{$('sv').classList.add('hide');form()};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,rnd=(a,b)=>a+Math.random()*(b-a);
let AC=null,MG=null,snd=true;
const sOn=()=>AC&&snd;
function aud(){if(AC||!snd)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination);drone();setTimeout(melody,2500)}catch(e){AC=null}}
function noise(d){const b=AC.createBuffer(1,Math.ceil(AC.sampleRate*d),AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;return s}
function tone(f,t0,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(MG);o.start(t0);o.stop(t0+d+.05)}
function drone(){[55,55.4,82.4].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter(),l=AC.createOscillator(),lg=AC.createGain();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=220;g.gain.value=.05;l.frequency.value=.07+i*.03;lg.gain.value=60;l.connect(lg);lg.connect(fl.frequency);o.connect(fl);fl.connect(g);g.connect(MG);o.start();l.start()})}
const SC=[220,261.63,293.66,329.63,349.23,415.3,440,523.25,587.33];
function melody(){if(sOn()){const t=AC.currentTime,n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++)tone(SC[Math.floor(Math.random()*SC.length)]*(Math.random()<.3?2:1),t+i*.7,2.2,'triangle',.07)}setTimeout(melody,3500+Math.random()*3000)}
function wail(){if(!sOn())return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),v=AC.createOscillator(),vg=AC.createGain();o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(180,t+4);v.frequency.value=5;vg.gain.value=18;v.connect(vg);vg.connect(o.frequency);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+1);g.gain.linearRampToValueAtTime(0,t+4.5);o.connect(g);g.connect(MG);o.start(t);v.start(t);o.stop(t+4.6);v.stop(t+4.6)}
function thunder(){if(!sOn())return;const t=AC.currentTime,n=noise(3),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=180;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.7,t+.15);g.gain.exponentialRampToValueAtTime(.001,t+3);n.connect(f);f.connect(g);g.connect(MG);n.start(t)}
function creak(){if(!sOn())return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(90,t);o.frequency.linearRampToValueAtTime(160,t+.6);o.frequency.linearRampToValueAtTime(70,t+1.4);f.type='bandpass';f.frequency.value=700;f.Q.value=6;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.1);g.gain.linearRampToValueAtTime(0,t+1.5);o.connect(f);f.connect(g);g.connect(MG);o.start(t);o.stop(t+1.6)}
function knock(){if(!sOn())return;const t=AC.currentTime;[0,.25,.5].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t+d);o.frequency.exponentialRampToValueAtTime(50,t+d+.12);g.gain.setValueAtTime(.5,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.15);o.connect(g);g.connect(MG);o.start(t+d);o.stop(t+d+.2)})}
function whisper(){if(!sOn())return;const t=AC.currentTime,n=noise(2),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.setValueAtTime(2500,t);f.frequency.linearRampToValueAtTime(1500,t+1.8);f.Q.value=3;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.6);g.gain.linearRampToValueAtTime(0,t+1.9);n.connect(f);f.connect(g);g.connect(MG);n.start(t)}
function flap(){if(!sOn())return;const t=AC.currentTime;for(let i=0;i<5;i++){const n=noise(.12),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=900;g.gain.setValueAtTime(.15,t+i*.18);g.gain.exponentialRampToValueAtTime(.001,t+i*.18+.12);n.connect(f);f.connect(g);g.connect(MG);n.start(t+i*.18)}}
function chime(){if(!sOn())return;const t=AC.currentTime;[659.25,783.99,987.77,1318.5].forEach((f,i)=>tone(f,t+i*.09,1.6,'sine',.08))}
function bad(){if(!sOn())return;const t=AC.currentTime;tone(70,t,1,'sawtooth',.2);tone(74,t,1,'sawtooth',.2)}
function tgl(){snd=!snd;$('bsnd').textContent=snd?'🔊':'🔇';if(snd){AC?AC.resume():aud()}else if(AC)AC.suspend()}
function fx(cls,txt,st,ms){const e=document.createElement('div');e.className=cls+(/^(gh|bt|sk|sp|ey|pk|cat)$/.test(cls)?' hit':'');if(txt)e.textContent=txt;Object.assign(e.style,st||{});$('fx').appendChild(e);setTimeout(()=>e.remove(),ms)}
const EV=[()=>{fx('gh','👻',{top:rnd(15,70)+'vh'},9200);wail()},
()=>{fx('bt','🦇',{top:rnd(10,60)+'vh'},5200);fx('bt','🦇',{top:rnd(10,60)+'vh',animationDelay:'.6s'},5800);flap()},
()=>{fx('ey','',{left:(Math.random()<.5?rnd(2,12):rnd(84,94))+'vw',top:rnd(20,80)+'vh'},3300);whisper()},
()=>{fx('sk','💀',{left:rnd(8,80)+'vw'},3500);knock()},
()=>{fx('sp','',{left:rnd(5,92)+'vw'},4600);creak()},
()=>{fx('lt','',{},700);thunder()},
()=>{fx('pk','🎃',{},8200);creak()},
()=>{fx('cat','🐈‍⬛',{},4600);whisper()}];
function director(){if(!reduce)EV[Math.floor(Math.random()*EV.length)]();setTimeout(director,rnd(5000,10000))}
function burst(){const r=$('qc').getBoundingClientRect();for(let i=0;i<10;i++)fx('ws',['✨','🕯️','💫'][i%3],{left:(r.left+Math.random()*r.width)+'px',top:(r.top+r.height*.6)+'px',animationDelay:(Math.random()*.4)+'s'},2300)}
function hitFx(e){const t=e.target.closest&&e.target.closest('.hit');if(!t||t.dataset.d)return;t.dataset.d=1;t.classList.add('pop');setTimeout(()=>t.remove(),360);
 const st={left:e.clientX+'px',top:e.clientY+'px'};if((S.b||0)<10){S.b=(S.b||0)+1;fx('pt','+0,1',st,1300);if(typeof chime=='function')chime()}else fx('pt','Bonus máximo',st,1300);bar()}
$('fx').addEventListener('pointerdown',hitFx);document.addEventListener('pointerdown',aud,{once:true});$('bsnd').onclick=tgl;setTimeout(director,4000);
(function(){for(let i=0;i<16;i++){const s=document.createElement('span');s.style.left=(Math.random()*100)+'vw';s.style.animationDelay=(-Math.random()*14)+'s';s.style.animationDuration=(10+Math.random()*10)+'s';$('dust').appendChild(s)}})();
intro();
</script>
