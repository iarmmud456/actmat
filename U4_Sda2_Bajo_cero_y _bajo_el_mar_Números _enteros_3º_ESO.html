<style>
/* Concepto: cuaderno cuadriculado de clase. Papel con cuadrícula azul, tinta azul, corrección en rojo como el bolígrafo del profesor. */
:root {

.opt input { margin-top: 5px; accent-color: var(--primary); width: 18px; height: 18px; flex: 0 0 auto; }

.fb.ok { background: var(--green-soft); border-color: var(--green); }
.fb.no { background: var(--red-soft); border-color: var(--red); }
.fb.hint { background: var(--amber-soft); border-color: var(--amber); }
.fb b.mark { font-family: var(--f-display); }
.fb ul { margin: 6px 0 0; padding-left: 20px; }
.score { font-family: var(--f-mono); font-weight: 600; font-size: 14px; color: var(--muted); }

.gridbox { display: grid; grid-template-columns: minmax(0, 260px) 1fr; gap: 16px; align-items: center; }

.gridbox svg { width: 100%; max-width: 260px; height: auto; aspect-ratio: 1; border: 2px solid var(--ink); border-radius: 6px; background: var(--paper); }
.gridbox .tile { fill: var(--tile); }
.gridbox .ln { stroke: var(--ink); stroke-width: 1.2; fill: none; opacity: .8; }
.gridbox input[type=range] { width: 100%; accent-color: var(--primary); }
.readout { font-family: var(--f-mono); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }

.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 4px; }

/* Informe */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { border: 2px solid var(--line); border-radius: 8px; padding: 12px; background: var(--paper); }
.kpi .v { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }

.crit-list { display: flex; flex-direction: column; gap: 14px; }

.crit .desc { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
.meter { grid-column: 1 / -1; height: 10px; border-radius: 99px; background: var(--paper); border: 1.5px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--primary); }
.meter i.low { background: var(--red); }
.meter i.mid { background: var(--amber); }
.meter i.high { background: var(--green); }
.lvl { font-family: var(--f-mono); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.tscroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; min-width: 520px; }
th, td { border-bottom: 1.5px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }

td.m { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-weight: 700; z-index: 40; max-width: calc(100% - 32px); }
.note { font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>

  "ACT.3.4.1": "Gestionar las emociones propias y desarrollar el autoconcepto matemático como herramienta, generando expectativas positivas ante el tratamiento y la gestión de retos y cambios, desarrollando, de manera progresiva, el pensamiento crítico y creativo, adaptándose ante la incertidumbre y reconociendo fuentes de estrés.",

var LIK = ["Casi nunca", "A veces", "Casi siempre", "Siempre"];

/* ---------- Estado ---------- */
var KEY = "enteros-3eso-div-v1";
var S = { student: null, view: "login", a: {}, prev: undefined, last: undefined };
try { var raw = localStorage.getItem(KEY); if (raw) { var d = JSON.parse(raw); if (d && d.a) { S.a = d.a; S.student = d.student || null; S.view = d.view || "login"; S.prev = d.prev; S.last = d.last; } } } catch (e) {}
if (!S.student) S.view = "login";
function save() { try { localStorage.setItem(KEY, JSON.stringify({ student: S.student, view: S.view, a: S.a, prev: S.prev, last: S.last })); } catch (e) {} }
function A(id) { return S.a[id] || (S.a[id] = { value: null, attempts: 0, done: false, score: null, hints: 0, status: "" }); }

var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function fmt(n) { return (Math.round(n * 10) / 10).toFixed(1).replace(".", ","); }
function level(n) { return n < 5 ? ["Insuficiente", "IN", "low"] : n < 6 ? ["Suficiente", "SU", "mid"] : n < 7 ? ["Bien", "BI", "mid"] : n < 9 ? ["Notable", "NT", "high"] : ["Sobresaliente", "SB", "high"]; }

/* ---------- Cálculo de resultados ---------- */
function progress() { var d = 0; ITEMS.forEach(function (it) { if (A(it.id).done) d++; }); return { done: d, total: ITEMS.length }; }
function critScores() {
  return CRIT_ORDER.map(function (code) {
    var its = ITEMS.filter(function (it) { return it.crit.indexOf(code) >= 0; });
    var done = its.filter(function (it) { return A(it.id).done; });
    var avg = done.reduce(function (s, it) { return s + A(it.id).score; }, 0) / its.length;
    return { code: code, items: its, nDone: done.length, score: avg };
  });
}
function overall() {
  var cs = critScores();
  return cs.reduce(function (s, c) { return s + c.score; }, 0) / cs.length;
}
function resultText(it) {
  var a = A(it.id);
  if (!a.done) return "Sin hacer";
  if (it.type === "likert") return "Autoevaluación: " + LIK[a.value];
  if (it.type === "text") return "Rúbrica " + a.found + "/" + it.rubric.length;
  if (a.status === "ok") return a.attempts === 1 ? "Acierto a la 1.ª" : "Acierto a la 2.ª";
  return "No resuelta";
}

/* ---------- Comprobación ---------- */
function toNum(v) { var n = parseFloat(String(v == null ? "" : v).trim().replace(/\u2212/g, "-").replace(",", ".")); return isNaN(n) ? null : n; }
function isEmpty(it, v) {
  if (it.type === "mcq" || it.type === "likert") return v === null || v === undefined;
  if (it.type === "table") return !v || v.length < it.answer.length || v.some(function (x) { return toNum(x) === null; });
  if (it.type === "slider") return false;
  if (it.type === "text") return !v || v.trim().length < 20;
  return toNum(v) === null;
}
function isRight(it, v) {
  if (it.type === "mcq") return v === it.answer;
  if (it.type === "num") return Math.abs(toNum(v) - it.answer) <= (it.tol || 0) + 1e-9;
  if (it.type === "table") return it.answer.every(function (x, i) { return toNum(v[i]) === x; });
  if (it.type === "slider") return v === it.answer;
  return false;
}
function submit(it) {
  var a = A(it.id);
  if (a.done) return;
  var v = a.value;
  if (it.type === "slider" && v == null) v = a.value = it.value0;
  if (isEmpty(it, v)) {
    a.msg = it.type === "text" ? "Escribe al menos 20 caracteres para poder evaluar tu explicación." : it.type === "table" ? "Rellena todas las casillas con números." : "Escribe o elige una respuesta antes de comprobar.";
    return;
  }
  a.msg = "";
  a.attempts++;
  if (it.type === "text") {
    var found = it.rubric.filter(function (r) { return r.re.test(v); });
    a.found = found.length; a.rub = it.rubric.map(function (r) { return r.re.test(v); });
    a.score = a.found / it.rubric.length * 10; a.done = true; a.status = a.found === it.rubric.length ? "ok" : "partial";
    return;
  }
  if (isRight(it, v)) { a.done = true; a.status = "ok"; a.score = a.attempts === 1 ? 10 : 6; }
  else if (a.attempts >= 2) { a.done = true; a.status = "fail"; a.score = 0; }
  else a.status = "retry";
}

/* ---------- Vistas ---------- */
function fillGrid(id, n) {

  var it = BY_ID[id], mn = it.min, mx = it.max, k = 220 / (mx - mn);
  var Y = function (v) { return 20 + (mx - v) * k; };

  var s = '<rect x="112" y="20" width="24" height="220" rx="12" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>';
  s += '<rect x="116" y="' + Math.min(Y(0), Y(n)) + '" width="16" height="' + Math.abs(Y(n) - Y(0)) + '" fill="' + (n < 0 ? "var(--red)" : "var(--primary)") + '"/>';
  for (var v = mn; v <= mx; v++) {
    var big = v % 5 === 0;
    s += '<line class="ln" x1="' + (big ? 100 : 106) + '" y1="' + Y(v) + '" x2="112" y2="' + Y(v) + '"/>';
    if (big) s += '<text x="94" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="12" fill="var(--ink)" font-family="monospace">' + m(v) + '</text>';
  }
  s += '<line x1="104" y1="' + Y(0) + '" x2="150" y2="' + Y(0) + '" stroke="var(--ink)" stroke-width="2"/>';
  s += '<circle cx="124" cy="' + Y(n) + '" r="9" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>';
  s += '<text x="160" y="' + (Y(n) + 5) + '" font-size="14" font-weight="700" fill="var(--ink)" font-family="monospace">' + m(n) + ' \u00b0C</text>';
  el.innerHTML = s;
}

function inputHTML(it) {

  var courses = [];
  var nm = S.student ? S.student.name : "", cs = S.student ? S.student.course : "";
  var s = '<main><div class="sheet stack"><span class="eyebrow">Ámbito científico-tecnológico · Diversificación 3º ESO · Situación de aprendizaje</span><h1>Bajo cero y bajo el mar</h1>' +
    '<p class="lead">Una base polar a −12 °C y un buque oceanográfico que sondea el fondo del mar. Con ellos trabajarás los números enteros: orden, suma, resta, multiplicación, división y operaciones combinadas. Son 21 actividades en 4 etapas y tu progreso se guarda en este navegador.</p></div>' +

}

function stageHTML(i) {

  ITEMS.forEach(function (it) {

}

function stageView() {
  if (/^[0-3]$/.test(S.prev || "")) return S.prev;
  for (var i = 0; i < STAGES.length; i++) { if (!ITEMS.every(function (it) { return it.stage !== i || A(it.id).done; })) return String(i); }

}
function goto(v) {

function refreshCard(id) {

}
function refreshSteps() {

}
function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 3500); }

/* ---------- Eventos ---------- */
function bind() {
  var f = $("login");
  if (f) f.onsubmit = function (ev) {
    ev.preventDefault();
    var n = $("f-name").value.trim().replace(/\s+/g, " "), c = $("f-course").value.trim().replace(/\s+/g, " ");
    if (n.length < 3) { $("f-err").textContent = "Escribe tu nombre y apellidos."; $("f-name").focus(); return; }
    if (!c) { $("f-err").textContent = "Escribe tu curso."; $("f-course").focus(); return; }
    var changed = S.student && (S.student.name !== n || S.student.course !== c);
    if (changed && progress().done > 0 && !bind.ok) { bind.ok = true; $("f-err").textContent = "Cambiar de alumno borra las respuestas guardadas. Pulsa otra vez para confirmar."; return; }
    bind.ok = false;

}
document.addEventListener("input", function (ev) {
  var el = ev.target, id = el.dataset && el.dataset.in; if (!id) return;

  else if (it.type === "slider") { a.value = Number(el.value); fillGrid(id, a.value); $("ro-" + id).textContent = it.ro(a.value); }
  else if (it.type === "table") { if (!a.value) a.value = []; a.value[Number(el.dataset.k)] = el.value; }
  else a.value = el.value;
  save();
});
document.addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-act]"); if (!b) return;
  var act = b.dataset.act, id = b.dataset.id;

  else if (act === "likert") { var a2 = A(id); a2.done = true; a2.status = "ok"; a2.attempts = 1; a2.score = a2.value / 3 * 10; refreshCard(id); }
  else if (act === "retext") { var a3 = A(id); a3.done = false; refreshCard(id); }

  else if (act === "reset0") render();
  else if (act === "reset2") { S = { student: null, view: "login", a: {} }; try { localStorage.removeItem(KEY); } catch (e) {} render(); window.scrollTo(0, 0); }
});

/* ---------- Informe PDF ---------- */
function safe(t) {
  return String(t).replace(/<sup>/g, "^").replace(/<\/sup>/g, "").replace(/<br\s*\/?>/g, " ").replace(/<[^>]+>/g, "")
    .replace(/√/g, "raiz de ").replace(/≈/g, "~").replace(/→/g, "->").replace(/−/g, "-").replace(/✓/g, "[x]").replace(/✗/g, "[ ]").replace(/…/g, "...").replace(/«|»/g, '"').replace(/·/g, "x");
}
function slug(t) { return t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "alumno"; }
function loadJsPdf() {
  return new Promise(function (res) {
    if (window.jspdf) return res(true);
    var s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = function () { res(!!window.jspdf); }; s.onerror = function () { res(false); };
    document.head.appendChild(s);
  });
}
function summaryText() {
  var p = progress(), o = overall(), t = ["Bajo cero y bajo el mar - Ámbito científico-tecnológico, Diversificación 3º ESO", S.student.name + " - " + S.student.course + " - " + new Date().toLocaleDateString("es-ES"), "Progreso: " + p.done + " de " + p.total + " actividades", "Nota media por criterios: " + (o === null ? "sin calificar" : fmt(o) + " / 10 (" + level(o)[0] + ")"), ""];
  critScores().forEach(function (c) { t.push(c.code + ": " + (c.score === null ? "sin hacer" : fmt(c.score) + " / 10")); });
  var e = A("X1"); if (e.done) t.push("", "Explicación escrita: " + e.value);
  return t.join("\n");
}
function copySummary() {
  var t = summaryText();
  var fail = function () { var ta = $("sumtxt"); if (ta) { ta.hidden = false; ta.value = t; ta.focus(); ta.select(); } toast("Copia el texto seleccionado."); };
  try { navigator.clipboard.writeText(t).then(function () { toast("Resumen copiado."); }, fail); } catch (e) { fail(); }
}
async function makePdf() {
  if (!S.student) { toast("Identifícate primero para generar tu informe."); return; }
  toast("Preparando el informe…");
  if (!(await loadJsPdf())) { toast("No se pudo cargar el generador de PDF. Comprueba tu conexión e inténtalo de nuevo."); return; }
  var dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
  var jsPDF = window.jspdf.jsPDF, doc = new jsPDF({ unit: "mm", format: "a4" });
  var M = 16, W = 210, y = 0, p = progress(), o = overall(), cs = critScores();
  function need(h) { if (y + h > 282) { doc.addPage(); y = 18; } }
  function txt(t, x, size, bold, color) { doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(size); doc.setTextColor.apply(doc, color || [21, 33, 92]); doc.text(safe(t), x, y); }
  function para(t, size, bold, color, width, lh) {
    doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(size); doc.setTextColor.apply(doc, color || [21, 33, 92]);
    var lines = doc.splitTextToSize(safe(t), width || (W - 2 * M)); var step = lh || size * 0.42;
    lines.forEach(function (l) { need(step); doc.text(l, M, y); y += step; });
  }
  doc.setFillColor(21, 33, 92); doc.rect(0, 0, W, 34, "F");
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.text("Informe de aprendizaje", M, 15);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); doc.text("Situación de aprendizaje: Bajo cero y bajo el mar (números enteros)", M, 22);
  doc.setFontSize(9); doc.text("Ámbito científico-tecnológico - Diversificación 3º ESO - Dpto. Matemáticas 2026/2027 - I.E.S. Ntra. Sra. de la Cabeza, Andújar", M, 28.5);
  y = 46;
  txt("Alumno/a:", M, 11, true); txt(S.student.name, M + 26, 11, false); y += 7;
  txt("Curso:", M, 11, true); txt(S.student.course, M + 26, 11, false); y += 7;
  txt("Fecha:", M, 11, true); txt(new Date().toLocaleDateString("es-ES"), M + 26, 11, false); y += 7;
  txt("Progreso:", M, 11, true); txt(p.done + " de " + p.total + " actividades terminadas (" + Math.round(p.done / p.total * 100) + " %)", M + 26, 11, false); y += 10;
  doc.setDrawColor(21, 33, 92); doc.setLineWidth(0.6); doc.rect(M, y, W - 2 * M, 20);
  y += 8; txt(o === null ? "Sin calificación todavía" : "Nota media por criterios: " + fmt(o) + " / 10  (" + level(o)[0] + ")", M + 4, 14, true); y += 7;
  txt(p.done < p.total ? "Faltan actividades por terminar: las actividades y criterios sin hacer cuentan 0." : "Todas las actividades terminadas.", M + 4, 9.5, false, [79, 90, 134]); y += 13;

  txt("Evaluación por criterio", M, 13, true); y += 7;
  cs.forEach(function (c) {
    var lines = doc.splitTextToSize(safe(CRIT[c.code]), W - 2 * M); need(12 + lines.length * 3.6);
    txt(c.code, M, 10, true); txt(c.score === null ? "Sin hacer" : fmt(c.score) + " / 10 - " + level(c.score)[0], M + 32, 10, true, c.score === null ? [79, 90, 134] : c.score < 5 ? [201, 58, 38] : [23, 118, 78]);
    txt(c.nDone + " de " + c.items.length + " act.", W - M - 24, 9, false, [79, 90, 134]); y += 2;
    doc.setFillColor(220, 230, 244); doc.rect(M, y, 60, 2.4, "F");
    if (c.score !== null) { doc.setFillColor.apply(doc, c.score < 5 ? [201, 58, 38] : c.score < 7 ? [200, 140, 20] : [23, 118, 78]); doc.rect(M, y, 60 * c.score / 10, 2.4, "F"); }
    y += 6; doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(79, 90, 134);
    lines.forEach(function (l) { doc.text(l, M, y); y += 3.6; }); y += 3;
  });

  need(20); y += 2; txt("Detalle de actividades", M, 13, true); y += 7;
  function row(c, bold) {
    doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(8.5); doc.setTextColor(21, 33, 92);
    doc.text(safe(c[0]), M, y); doc.text(safe(c[1]), M + 68, y); doc.text(safe(c[2]), M + 92, y); doc.text(safe(c[3]), M + 142, y); doc.text(safe(c[4]), M + 157, y);
  }
  need(8); row(["Actividad", "Criterio", "Resultado", "Pistas", "Nota"], true); y += 2; doc.setDrawColor(150, 165, 200); doc.setLineWidth(0.2); doc.line(M, y, W - M, y); y += 4.5;
  ITEMS.forEach(function (it) {
    var a = A(it.id); need(6);
    row([it.id + " - " + it.title, it.crit.map(function (c) { return c.replace("MAT.", ""); }).join(", "), resultText(it).replace("Autoevaluación: ", "Autoeval.: "), String(a.hints || 0), a.done ? fmt(a.score) : "-"]); y += 5.2;
  });
  var e = A("X1");
  y += 4; need(24); txt("Explicación escrita por el alumno/a", M, 13, true); y += 6;
  if (e.done) {
    para(e.value, 10, false, null, null, 4.6); y += 2;
    para("Rúbrica automática: " + e.found + " de " + BY_ID.X1.rubric.length + " elementos (" + BY_ID.X1.rubric.map(function (r, i) { return (e.rub[i] ? "[x] " : "[ ] ") + r.label; }).join("; ") + ").", 8.5, false, [79, 90, 134]);
  } else para("No se ha entregado explicación.", 10, false, [79, 90, 134]);
  y += 5; need(30); txt("Autoevaluación del alumno/a", M, 13, true); y += 6;
  ["L1", "L2", "L3"].forEach(function (id) {
    var a = A(id); para(BY_ID[id].crit[0] + " - " + BY_ID[id].prompt + " Respuesta: " + (a.done ? LIK[a.value] : "sin responder"), 9.5, false, null, null, 4.3); y += 1.5;
  });
  y += 4; need(36);
  para("Notas para el profesorado: la nota de cada criterio es la suma de las notas de sus actividades dividida entre todas las actividades del criterio (acierto a la primera 10, a la segunda 6, no resuelta 0; las autoevaluaciones puntúan de 0 a 10 según la frecuencia indicada), de modo que las actividades sin hacer cuentan 0. La nota global es la media simple de los 16 criterios, y los criterios sin hacer cuentan 0; la programación didáctica establece media ponderada, por lo que deben aplicarse los pesos del departamento. Los criterios de trabajo en equipo, trabajo experimental y laboratorio, paisaje y biodiversidad del ámbito (p. ej. ACT.3.7.3, ACT.3.9.4, ACT.3.10.1 o ACT.3.11.x) no se evalúan en esta actividad individual.", 8.5, false, [79, 90, 134]);
  var n = doc.getNumberOfPages();
  for (var i = 1; i <= n; i++) { doc.setPage(i); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(120, 130, 160); doc.text("Bajo cero y bajo el mar - " + safe(S.student.name) + " - " + S.student.course, M, 291); doc.text("Página " + i + " de " + n, W - M - 22, 291); }
  var buf = doc.output("arraybuffer"), name = "informe_enteros_" + slug(S.student.name) + ".pdf";
  if (dl) {
    try { await dl.save({ filename: name, data: buf.slice(0) }); toast("Informe guardado."); return; }

  }
  try {
    var u = URL.createObjectURL(new Blob([buf], { type: "application/pdf" })), l = document.createElement("a");

    setTimeout(function () { URL.revokeObjectURL(u); }, 8000);
    toast("Informe generado. Si no se descarga, abre la aplicación en el navegador o usa «Copiar resumen» en Resultados.");
  } catch (e2) { toast("No se pudo descargar aquí. Usa «Copiar resumen» en Resultados."); }
}

render();
if (/^[0-3]$/.test(S.view) && S.last && BY_ID[S.last] && BY_ID[S.last].stage === Number(S.view)) setTimeout(function () { var c = $("card-" + S.last); if (c) c.scrollIntoView({ block: "center" }); }, 80);
})();
</script>
