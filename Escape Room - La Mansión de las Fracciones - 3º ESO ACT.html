<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Mansión de las Fracciones · Escape Room</title>
<style>
:root{--bg:#0b0c10;--bg2:#1f2833;--tx:#d5dbe0;--mut:#8a97a3;--red:#ff2a4d;--grn:#39ff88;--card:rgba(31,40,51,.82);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,var(--bg2) 0%,var(--bg) 70%) fixed;color:var(--tx);font-family:Georgia,'Times New Roman',serif;line-height:1.5;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(ellipse 40% 25% at 20% 70%,rgba(180,200,210,.10),transparent 70%),radial-gradient(ellipse 45% 22% at 80% 85%,rgba(160,190,180,.10),transparent 70%);animation:fog 28s linear infinite alternate}
body::after{animation-duration:40s;animation-direction:alternate-reverse;opacity:.8}
@keyframes fog{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
.vig{position:fixed;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 160px 40px #000}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,12,16,.94);border-bottom:1px solid #2b3a47;padding:10px 14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:1.05rem;margin:0;color:var(--red);letter-spacing:.06em;text-shadow:0 0 8px var(--red);animation:fl 5s infinite}
@keyframes fl{0%,92%,100%{opacity:1}93%{opacity:.4}95%{opacity:1}97%{opacity:.5}}
.bar{height:10px;background:#12171d;border:1px solid #2b3a47;border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0a8f4a,var(--grn));box-shadow:0 0 10px var(--grn);transition:width .6s}
.meta{font-size:.82rem;color:var(--mut);font-family:system-ui,sans-serif}
main{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border:1px solid #2b3a47;border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 10px 40px #000a}
.card.ok{animation:gl 1s}.card.bad{animation:sh .4s}
@keyframes gl{0%{box-shadow:0 0 0 0 var(--grn)}40%{box-shadow:0 0 40px 6px var(--grn)}100%{box-shadow:0 10px 40px #000a}}
@keyframes sh{20%,60%{transform:translateX(-6px);box-shadow:0 0 30px var(--red)}40%,80%{transform:translateX(6px)}}
h2{margin:0 0 4px;color:var(--grn);text-shadow:0 0 8px #39ff8866;font-size:1.3rem}
h3{margin:0 0 8px;color:var(--red);font-size:1rem;letter-spacing:.05em}
.sub{color:var(--mut);font-style:italic;margin:0 0 10px}
.q{font-size:1.15rem;margin:8px 0 14px}
input[type=text],textarea,select{width:100%;background:#0b0c10;color:var(--grn);border:1px solid #2b3a47;border-radius:8px;padding:10px 12px;font:1.1rem ui-monospace,Consolas,monospace}
input:focus,textarea:focus{outline:none;border-color:var(--grn);box-shadow:0 0 10px #39ff8866}
textarea{font-size:.8rem;min-height:90px;color:var(--tx)}
button{font:600 .95rem system-ui,sans-serif;cursor:pointer;border-radius:8px;border:1px solid var(--grn);background:#0b0c10;color:var(--grn);padding:10px 16px;margin:8px 8px 0 0;transition:.2s}
button:hover{background:var(--grn);color:#000;box-shadow:0 0 14px var(--grn)}
button.r{border-color:var(--red);color:var(--red)}button.r:hover{background:var(--red);color:#fff;box-shadow:0 0 14px var(--red)}
button.s{border-color:#4a5b6a;color:var(--mut);font-size:.82rem;padding:6px 10px;margin:0}
.msg{margin-top:12px;min-height:1.4em;font-family:system-ui,sans-serif}
.g{color:var(--grn)}.rd{color:var(--red)}
.hint{border-left:3px solid var(--red);padding:6px 10px;margin-top:10px;color:#ffb3c0;background:#ff2a4d14}
table{width:100%;border-collapse:collapse;font:.88rem system-ui,sans-serif;margin-top:8px}
td,th{padding:6px;border-bottom:1px solid #2b3a47;text-align:left}
label{display:block;margin:10px 0 4px;color:var(--mut);font:.85rem system-ui,sans-serif}
.hide{display:none}
.opt label{display:flex;gap:8px;align-items:flex-start;color:var(--tx);margin:6px 0}
.opt input{margin-top:5px}
.scene{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:10px 14px 0}
.scene svg{width:100%;height:auto;display:block;border-radius:10px;border:1px solid #2b3a47;box-shadow:0 10px 40px #000}
#qc{border-color:#2fd6ff88;background:linear-gradient(160deg,rgba(20,70,90,.5),rgba(10,40,45,.6));box-shadow:0 0 30px #2fd6ff33,inset 0 0 40px #2fd6ff14}
#qc .q{font-size:1.3rem;color:#bff6ff;text-shadow:0 0 8px #2fd6ff88}
.dust span{position:fixed;left:0;width:3px;height:3px;border-radius:50%;background:#ffd89a;opacity:.5;z-index:1;pointer-events:none;animation:dr 14s linear infinite}
@keyframes dr{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}
.flick{animation:fk 3s infinite alternate}@keyframes fk{50%{opacity:.7}}
#hero{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:10px;border:1px solid #2b3a47;box-shadow:0 10px 40px #000;transition:aspect-ratio .6s}
.play #hero{aspect-ratio:21/7}
</style>
</head>

const Q=[
{c:'3.1',t:`La reja de la cripta solo se abre con la fracción irreducible de 84/126. ¿Cuál es?`,a:[2,3],h:`84 y 126 son múltiplos de 42. Divide ambos entre su MCD.`,f:`Simplifica hasta que numerador y denominador no compartan divisores.`},
{c:'3.2',t:`En la cripta hay 36 lápidas y 15 están rotas. ¿Qué fracción irreducible del total está rota?`,a:[5,12],h:`Escribe 15/36 y divide entre 3.`,f:`Parte (rotas) entre todo (36), y después simplifica.`},
{c:'3.1',t:`Para abrir el cofre, 3/7 debe ser equivalente a x/42. ¿Cuánto vale x?`,a:[18,1],h:`De 7 a 42 se multiplica por 6; haz lo mismo con el numerador.`,f:`Multiplica numerador y denominador por el mismo número.`},
{c:'3.2',t:`En el salón están encendidas 12 de 16 calabazas y en la cripta 15 de 25. Calcula la diferencia entre ambas fracciones (irreducible). ¿Qué sala brilla más?`,a:[3,20],h:`Simplifica primero: 12/16 = 3/4 y 15/25 = 3/5. Después resta.`,f:`Simplifica cada fracción, compara y resta con común denominador.`},
{c:'3.1',t:`Mezcla del alquimista: 3/4 + 5/6 de litro. ¿Cuántos litros hay en total? (fracción irreducible)`,a:[19,12],h:`mcm(4, 6) = 12. Pasa a 9/12 + 10/12.`,f:`Denominadores distintos: busca primero el mínimo común múltiplo.`},
{c:'3.1',t:`Calcula 5/6 − 1/4 + 2/3 y escribe el resultado simplificado.`,a:[5,4],h:`Con denominador 12: 10/12 − 3/12 + 8/12.`,f:`Reduce todo a común denominador y opera de izquierda a derecha.`},
{c:'3.1',t:`Calcula 2/3 + 1/5 − 1/2 y simplifica.`,a:[11,30],h:`mcm(3, 5, 2) = 30: 20/30 + 6/30 − 15/30.`,f:`Busca el mcm de los tres denominadores.`},
{c:'3.1',t:`El alquimista tiene 7/4 de litro de poción y vierte 5/6 de litro en una probeta. ¿Cuántos litros le quedan?`,a:[11,12],h:`Con denominador 12: 21/12 − 10/12.`,f:`Es una resta con denominadores distintos.`},
{c:'3.1',t:`Primer espejo: calcula (3/4 : 9/8) · 5/2. Resultado irreducible.`,a:[5,3],h:`Dividir es multiplicar por la inversa: 3/4 · 8/9 = 2/3.`,f:`Haz primero el paréntesis (división) y luego multiplica.`},
{c:'3.1',t:`Segundo espejo: calcula 1/2 + 3/4 · (2/3 − 1/6).`,a:[7,8],h:`Orden: paréntesis (da 1/2), después el producto (3/8) y por último la suma.`,f:`Jerarquía: paréntesis, productos y cocientes, y al final sumas y restas.`},
{c:'3.1',t:`Tercer espejo: calcula (5/2 − 1/3) : 7/3.`,a:[13,14],h:`El paréntesis da 13/6. Dividir entre 7/3 es multiplicar por 3/7.`,f:`Resuelve el paréntesis y luego divide multiplicando por la inversa.`},
{c:'3.1',t:`Cuarto espejo: calcula (2/3 + 1/2) · (6/5 − 3/10).`,a:[21,20],h:`Los paréntesis dan 7/6 y 9/10. Multiplica y simplifica.`,f:`Haz cada paréntesis por separado antes de multiplicar.`},
{c:'3.2',t:`Un frasco tiene 120 ml de elixir. Se gasta 1/4 y después 2/5 de lo que quedaba. ¿Cuántos ml quedan?`,a:[54,1],h:`Tras gastar 1/4 quedan 90 ml. Ahora calcula 2/5 de 90.`,f:`El segundo gasto se calcula sobre el resto, no sobre los 120 ml.`},
{c:'3.2',t:`Del dinero del castillo se gastan 2/5 en pociones y 1/3 de lo que queda en velas. ¿Qué fracción del total sigue sin gastar?`,a:[2,5],h:`Tras las pociones queda 3/5. Las velas son 1/3 de 3/5 = 1/5.`,f:`Resta primero 2/5 al total (1) y trabaja con el resto.`},
{c:'3.1',t:`Una pócima de 90 ml: el vampiro bebe 1/3 y la bruja 3/5 de lo que queda. ¿Cuántos ml quedan?`,a:[24,1],h:`Tras el vampiro quedan 60 ml. La bruja bebe 3/5 de 60 = 36.`,f:`El segundo reparto se calcula sobre el resto.`},
{c:'3.2',t:`Del botín, 3/8 es para el brujo y 1/4 para la bruja. Si quedan 150 monedas, ¿cuántas había en total?`,a:[400,1],h:`Queda 1 − 3/8 − 2/8 = 3/8 del total, y eso son 150 monedas.`,f:`150 monedas es una fracción del total: ¿cuál? Después, plantea cuánto es 1/8.`}];

const PQ=0.625,$=id=>document.getElementById(id);
let S={i:0,q:Q.map(()=>[0,0,0,0])};let fin=false,res=null;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fm=a=>a[1]==1?''+a[0]:a[0]+'/'+a[1];
const pr=s=>{const m=s.trim().match(/^(-?\d+)\s*(?:\/\s*(\d+))?$/);return m?[+m[1],m[2]?+m[2]:1]:null};
const pts=i=>{const[a,h,ok]=S.q[i];return ok?Math.max(0,+(PQ-0.15*(a-1)-0.2*h).toFixed(3)):0};
const mmss=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const tot=()=>S.q.reduce((s,x)=>s+x[3],0);
function bar(){const n=S.q.filter(x=>x[2]).length,p=Math.round(n/Q.length*100);$('pb').style.width=p+'%';$('pp').textContent='Progreso: '+p+' % ('+n+'/'+Q.length+' pruebas superadas)';$('rm').textContent=S.i<Q.length?R[Math.floor(S.i/4)].n:'Salida';}
function intro(){fin=true;document.body.classList.remove('play');$('view').innerHTML=`<div class="card"><h2>La Mansión de las Fracciones</h2><p class="sub">Escape Room individual · 3.º ESO · Ámbito Científico-Tecnológico</p><p>Es medianoche de Halloween y la puerta de la mansión se ha cerrado a tus espaldas. Para escapar debes cruzar 4 salas resolviendo enigmas con fracciones. Hay 4 pruebas por sala (16 en total) y cada una vale hasta 0,625 puntos: cada reintento resta 0,15 y cada pista opcional 0,20. Escribe las fracciones como <b>a/b</b> y siempre <b>simplificadas</b>.</p><button id="go">Entrar en la mansión</button><button class="r" id="rs">Continuar partida guardada</button></div>`;$('go').onclick=()=>{S.i=0;render()};$('rs').onclick=()=>{$('sv').classList.remove('hide');$('code').focus()};bar();}
function render(){fin=false;document.body.classList.add('play');bar();if(S.i>=Q.length){return form()}
 const i=S.i,q=Q[i],r=R[Math.floor(i/4)],st=S.q[i],first=i%4==0;
 $('view').innerHTML=`${first?`<div class="card"><h2>${r.n}</h2><p class="sub">${r.s}</p><p>${r.d}</p></div>`:''}<div class="card" id="qc"><h3>PRUEBA ${i+1} DE ${Q.length} · ${CR[q.c][0]}</h3><div class="q">${q.t}</div><input type="text" id="ans" autocomplete="off" placeholder="p. ej. 3/5" ${st[2]?'disabled':''}><button id="chk" ${st[2]?'class="hide"':''}>RESOLVER</button><button class="r ${st[2]?'hide':''}" id="hb">PISTA (−0,20)</button><div class="msg" id="fb"></div><div id="hh"></div><button id="nx" class="${st[2]?'':'hide'}">Continuar →</button></div>`;
 $('ans').onkeydown=e=>{if(e.key=='Enter')chk()};$('chk').onclick=chk;$('hb').onclick=hint;$('nx').onclick=()=>{S.i++;render()};if(st[2])okMsg();else if(st[1])hshow();}
function hshow(){$('hh').innerHTML=`<div class="hint">💡 ${Q[S.i].h}</div>`}
function hint(){const st=S.q[S.i];if(!st[1])st[1]=1;hshow()}
function okMsg(){const i=S.i;$('fb').innerHTML=`<span class="g">✔ ¡Correcto! Respuesta: ${fm(Q[i].a)} · +${pts(i).toFixed(2)} pts.${i%4==3?`<br>🚪 La puerta se abre. Obtienes: ${R[Math.floor(i/4)].k}`:''}</span>`}
function chk(){const i=S.i,q=Q[i],st=S.q[i],v=pr($('ans').value),c=$('qc');if(st[2])return;
 if(!v||v[1]==0){$('fb').innerHTML='<span class="rd">Escribe un número o una fracción con el formato a/b.</span>';return}
 const eq=v[0]*q.a[1]==v[1]*q.a[0];
 if(eq&&gcd(v[0],v[1])!=1){$('fb').innerHTML='<span class="rd">Valor correcto, pero la fracción no está simplificada. Reduce y vuelve a intentarlo (no cuenta como intento).</span>';return}
 st[0]++;c.classList.remove('ok','bad');void c.offsetWidth;
 if(eq){st[2]=1;c.classList.add('ok');okMsg();$('nx').classList.remove('hide');$('chk').classList.add('hide');$('hb').classList.add('hide');$('ans').disabled=true;bar();}
 else{c.classList.add('bad');$('fb').innerHTML=`<span class="rd">✘ Incorrecto. La niebla se espesa… (intentos: ${st[0]})</span><div class="hint">${q.f}</div>`}}

 Q.forEach((q,i)=>{const c=cr[q.c]=cr[q.c]||{e:0,m:0};c.e+=pts(i);c.m+=PQ});

 let h=`<div class="card ok"><h2>Nota final: ${total.toFixed(2).replace('.',',')} / 10</h2><p class="sub">${nm} ${ap} · ${gr} · ${res.date}</p><h3>CRITERIOS DE EVALUACIÓN</h3><table><tr><th>Criterio</th><th>Logro</th><th>Grado</th></tr>`;

 Q.forEach((q,i)=>{const s=S.q[i];h+=`<tr><td>${i+1}</td><td>${s[0]}</td><td>${s[1]}</td><td>${mmss(s[3])}</td><td>${pts(i).toFixed(2)}</td>${sol?`<td>${fm(q.a)}</td>`:''}</tr>`});
 h+=`</table><p class="meta">Tiempo total: ${mmss(tot())}</p><button id="pd">Descargar informe PDF</button><div class="msg" id="pm"></div></div>`;
