<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misión Marte · Fracciones 3.º ESO</title>
<style>
:root{--bg:#0a0f1e;--p:#131a2e;--p2:#1b2440;--tx:#e6ecff;--mu:#8fa0c8;--ac:#4dd2ff;--wa:#ff9d4d;--ok:#3ddc97;--ko:#ff5c7a;--bd:#2a3558}
[data-theme=light]{--bg:#eef2f9;--p:#fff;--p2:#e4eaf6;--tx:#14203d;--mu:#55648a;--ac:#0077b6;--wa:#b84f00;--ok:#08874f;--ko:#c4203f;--bd:#c5cfe6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Segoe UI",sans-serif}
.mono,h1,h2,.tab,button{font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:5;background:var(--p);border-bottom:1px solid var(--bd);padding:10px 16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
h1{font-size:1.05rem;margin:0;color:var(--ac)}h2{font-size:1.15rem;margin:0 0 4px}
.pb{height:8px;background:var(--p2);border-radius:9px;margin:8px 0 4px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--wa));transition:width .4s}
.st{font-size:.8rem;color:var(--mu)}
button{background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
button:hover{border-color:var(--ac)}button.pr{background:var(--ac);color:#04111f;border-color:var(--ac);font-weight:700}
:focus-visible{outline:3px solid var(--wa);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}.tab{flex:1;min-width:120px;text-align:left;padding:8px 10px}.tab.on{border-color:var(--ac);background:var(--p2);box-shadow:inset 0 -3px var(--ac)}.tab small{display:block;color:var(--mu)}
main{max-width:860px;margin:0 auto;padding:16px}
.intro{border-left:4px solid var(--wa);padding:4px 14px;margin-bottom:14px;color:var(--mu)}
.card{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}.card.ok{border-color:var(--ok)}.card.ko{border-color:var(--ko)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--mu);margin-bottom:6px;flex-wrap:wrap}
.op{display:block;padding:8px 10px;margin:5px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer}.op:has(input:checked){border-color:var(--ac);background:var(--p2)}.op input{margin-right:8px}
input[type=text],select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit}
input[type=text]{width:84px;text-align:center}textarea{width:100%;min-height:120px}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px;font-size:.95em}.fr i{font-style:normal;border-bottom:2px solid currentColor;padding:0 4px}.fr b{font-weight:600}
.nf{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle;margin:0 8px}
.bar{width:100%;max-width:420px;display:block;margin:8px 0}
.fb{margin-top:10px;padding:10px;border-radius:8px;background:var(--p2);font-size:.92rem}.hint{color:var(--wa);font-size:.9rem;margin-top:8px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.reg{max-width:440px;margin:8vh auto}.reg label{display:block;margin:12px 0 4px}.reg input{width:100%;text-align:left}
.lk{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;margin:6px 0}
.lk select{width:70px}table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}
.fig,.hero,.ch{width:100%;display:block}.hero{margin-bottom:12px;border-radius:12px}.fig{max-width:420px;margin:6px 0 10px}
@media(max-width:560px){main{padding:10px}.tab{min-width:100px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const K='marte-fracciones-3eso-v1',$=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{u:null,a:{},tx:'',rb:[0,0,0,0],txd:0,lk:[0,0,0,0,0],th:null,st:1};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fr=s=>String(s).replace(/(\d+)\/(\d+)/g,'<span class=fr><i>$1</i><b>$2</b></span>');
const ST=['Reconocimiento','Suministros','Mando de misión','Informe de vuelo'];
const CR={'MAT.3.1.1':'Interpretar problemas matemáticos complejos, organizando los datos y sus relaciones','MAT.3.1.2':'Aplicar herramientas y estrategias apropiadas en problemas cotidianos y matemáticos','MAT.3.2.1':'Comprobar la corrección de las soluciones mediante el razonamiento matemático','MAT.3.2.2':'Comprobar la validez de las soluciones y su coherencia en el contexto','MAT.3.5.1':'Reconocer y usar relaciones entre conocimientos y experiencias matemáticas','MAT.3.7.2':'Elaborar representaciones (diagramas, expresiones simbolicas o graficas) para resolver','MAT.3.8.1':'Comunicar ideas y procesos con lenguaje matematico apropiado, por escrito','MAT.3.9.2':'Actitud positiva y perseverante; aceptar el error y las autoevaluaciones'};
const M={'CE1.1':'MAT.3.1.1','CE1.2':'MAT.3.1.2','CE2.1':'MAT.3.2.1','CE2.2':'MAT.3.2.2','CE5.1':'MAT.3.5.1','CE7.1':'MAT.3.7.2','CE8.1':'MAT.3.8.1','CE9.1':'MAT.3.9.2'};
const VF=['Verdadero','Falso'];
const A=[
{id:1,s:1,c:'CE1.1',w:1,t:'mcq',q:'La nave Ares lleva 12 depósitos de agua y 5 están llenos. ¿Qué fracción de los depósitos está llena?',o:['5/12','7/12','12/5','5/7'],k:0,h:'Parte-todo: las partes que cumplen la condición (numerador) entre el total de partes (denominador).',e:'Son 5 llenos de 12 en total: 5/12. El denominador es siempre el total, no las partes restantes.'},
{id:2,s:1,c:'CE1.2',w:1,t:'num',q:'Se reparten 3 raciones de oxígeno a partes iguales entre 4 astronautas. ¿Qué fracción de ración recibe cada uno?',f:['numerador','denominador'],a:[3,4],h:'Una fracción es también una división: 3 ÷ 4.',e:'Cociente: 3 ÷ 4 = 3/4 de ración por persona.'},
{id:3,s:1,c:'CE1.1',w:1,t:'mcq',q:'En la tripulación hay 2 ingenieros por cada 3 científicos. ¿Qué fracción de la tripulación son ingenieros?',o:['2/3','2/5','3/5','1/2'],k:1,h:'Una razón compara partes entre sí; la fracción compara una parte con el total.',e:'Por cada 5 personas (2+3), 2 son ingenieros: 2/5. La razón 2/3 compara ingenieros con científicos, no con el total.'},
{id:4,s:1,c:'CE7.1',w:1,t:'sl',q:'Los paneles solares son 8 módulos iguales. Mueve el control para iluminar 3/4 de ellos.',d:8,k:6,h:'Busca una fracción equivalente a 3/4 con denominador 8.',e:'3/4 = 6/8, así que hay que activar 6 módulos de 8.'},
{id:5,s:1,c:'CE5.1',w:1,t:'mcq',q:'Tres rovers recorren 5/8, 2/3 y 3/4 de la ruta. Ordénalos de menor a mayor recorrido.',o:['5/8 < 2/3 < 3/4','2/3 < 5/8 < 3/4','3/4 < 2/3 < 5/8','5/8 < 3/4 < 2/3'],k:0,h:'Reduce a común denominador (24) o pasa a decimales.',e:'Con denominador 24: 5/8 = 15/24, 2/3 = 16/24, 3/4 = 18/24. Orden: 5/8 < 2/3 < 3/4.'},
{id:6,s:1,c:'CE2.2',w:1,t:'mcq',b:1,q:'<b>¿Bulo o verdad?</b> Un compañero afirma: «1/8 es mayor que 1/4 porque 8 es mayor que 4».',o:VF,k:1,h:'Piensa en repartir una pizza entre 8 o entre 4 personas.',e:'Falso. Con numeradores iguales, a mayor denominador, trozos más pequeños: 1/8 < 1/4.'},
{id:7,s:2,c:'CE5.1',w:1,t:'num',q:'El consumo es 6/9 del depósito. Escribe la fracción irreducible equivalente.',f:['numerador','denominador'],a:[2,3],irr:1,h:'Divide numerador y denominador entre su máximo común divisor.',e:'mcd(6, 9) = 3, y 6/9 = 2/3.'},
{id:8,s:2,c:'CE1.2',w:1,t:'num',q:'Si 3/5 de la reserva son 12 kg de comida... completa la equivalencia: 3/5 = x/20. ¿Cuánto vale x?',f:['x'],a:[12],h:'Multiplicando 5 por 4 obtienes 20; haz lo mismo con el 3.',e:'20 ÷ 5 = 4, así que x = 3 · 4 = 12.'},
{id:9,s:2,c:'CE1.1',w:1,t:'num',q:'Hoy se gasta 1/3 de la comida y mañana 1/4. ¿Qué fracción se habrá gastado en total?',f:['numerador','denominador'],a:[7,12],irr:1,h:'Denominador común: m.c.m.(3, 4) = 12.',e:'1/3 + 1/4 = 4/12 + 3/12 = 7/12.'},
{id:10,s:2,c:'CE1.1',w:1,t:'num',q:'El tanque tiene 5/6 de su capacidad y se consume 1/3. ¿Qué fracción queda? (simplifica)',f:['numerador','denominador'],a:[1,2],irr:1,h:'1/3 = 2/6. Resta y simplifica.',e:'5/6 − 1/3 = 5/6 − 2/6 = 3/6 = 1/2.'},
{id:11,s:2,c:'CE7.1',w:1,t:'sl',q:'Representa 1/2 + 1/6 en doceavos: mueve el control hasta el resultado.',d:12,k:8,h:'1/2 = 6/12 y 1/6 = 2/12.',e:'6/12 + 2/12 = 8/12 (= 2/3). Hay que iluminar 8 de 12.'},
{id:12,s:2,c:'CE2.2',w:1,t:'mcq',b:1,q:'<b>¿Bulo o verdad?</b> Un compañero calcula 1/2 + 1/3 = 2/5 «sumando arriba con arriba y abajo con abajo».',o:VF,k:1,h:'Comprueba: 1/2 ya es 0,5, y 2/5 es 0,4. ¿Puede la suma ser menor que un sumando?',e:'Falso. No se suman denominadores: 1/2 + 1/3 = 3/6 + 2/6 = 5/6.'},
{id:13,s:3,c:'CE1.2',w:1.5,t:'num',q:'Un panel recibe 3/4 de la luz y la batería aprovecha 2/3 de esa luz. ¿Qué fracción de la luz total se aprovecha?',f:['numerador','denominador'],a:[1,2],irr:1,h:'«De» significa multiplicar: 2/3 · 3/4.',e:'2/3 · 3/4 = 6/12 = 1/2.'},
{id:14,s:3,c:'CE1.1',w:1.5,t:'num',q:'Cada ración de agua es 1/4 de litro. ¿Cuántas raciones salen de 3/2 de litro?',f:['raciones'],a:[6],h:'Dividir entre una fracción es multiplicar por su inversa.',e:'3/2 ÷ 1/4 = 3/2 · 4/1 = 12/2 = 6 raciones.'},
{id:15,s:3,c:'CE2.1',w:1.5,t:'num',q:'Calcula con la jerarquía de operaciones: 2/3 + 1/2 · 3/4',f:['numerador','denominador'],a:[25,24],irr:1,h:'Primero el producto, después la suma.',e:'1/2 · 3/4 = 3/8; 2/3 + 3/8 = 16/24 + 9/24 = 25/24.'},
{id:16,s:3,c:'CE1.1',w:1.5,t:'num',q:'El cohete lleva 240 L de combustible. El día 1 gasta 1/4 y el día 2 gasta 1/3 de lo que quedaba. ¿Cuántos litros quedan?',f:['litros'],a:[120],h:'Día 1: 1/4 de 240. Después calcula 1/3 del resto.',e:'Día 1: 60 L, quedan 180. Día 2: 180/3 = 60 L, quedan 120 L.'},
{id:17,s:3,c:'CE2.2',w:1.5,t:'mcq',b:1,q:'<b>¿Bulo o verdad?</b> «Dividir entre 1/2 es lo mismo que dividir entre 2, así que el resultado se reduce a la mitad».',o:VF,k:1,h:'¿Cuántas medias raciones caben en 1 ración?',e:'Falso. Dividir entre 1/2 equivale a multiplicar por 2: el resultado se duplica.'},
{id:18,s:4,c:'CE8.1',w:2,t:'tx'},
{id:19,s:4,c:'CE9.1',w:0,t:'lk'}];
A.forEach(q=>q.c=M[q.c]);
const LK=['Me he esforzado en resolver las actividades.','He leído las explicaciones para aprender de mis errores.','He usado las pistas solo cuando las necesitaba.','Me siento más seguro/a con las fracciones.','Sabría explicar a otra persona lo que he aprendido.'];
const RB=[['Procedimiento','No plantea la operación','Plantea con errores','Plantea 3/4 ÷ 6 correctamente','Plantea y justifica cada paso'],['Resultado y comprobación','Sin resultado','Resultado incorrecto','Resultado correcto (1/8)','Correcto y comprobado (6 · 1/8 = 3/4)'],['Vocabulario','Ninguno','Poco','Usa numerador, denominador...','Usa vocabulario preciso y variado'],['Claridad','Confuso','Poco ordenado','Ordenado','Claro y ordenado para un compañero']];
const R=id=>S.a[id]||(S.a[id]={n:0,p:0,d:0,h:0,v:null,m:''});
const wc=t=>t.trim().split(/\s+/).filter(Boolean).length;
const done=q=>q.t=='tx'?S.txd:q.t=='lk'?S.lk.every(x=>x>0):R(q.id).d;
const pts=q=>q.t=='tx'?(S.txd?S.rb.reduce((a,b)=>a+b,0)/16*10:0):R(q.id).p||0;
const crit=()=>{const o={};A.filter(q=>q.w).forEach(q=>(o[q.c]=o[q.c]||[]).push(pts(q)));for(const k in o)o[k]=o[k].reduce((a,b)=>a+b,0)/o[k].length;return o};
const nota=()=>{const v=Object.values(crit());return v.reduce((a,b)=>a+b,0)/v.length};
const sv=(w,h,b,c)=>`<svg viewBox="0 0 ${w} ${h}" class="${c||''}" aria-hidden="true">${b}</svg>`;
const pie=(cx,cy,r,n,m)=>Array.from({length:n},(_,i)=>{const a=i*2*Math.PI/n-Math.PI/2,b=(i+1)*2*Math.PI/n-Math.PI/2;return `<path d="M${cx} ${cy}L${cx+r*Math.cos(a)} ${cy+r*Math.sin(a)}A${r} ${r} 0 0 1 ${cx+r*Math.cos(b)} ${cy+r*Math.sin(b)}Z" fill="${i<m?'#4dd2ff':'#ffb07a'}" stroke="#0a0f1e" stroke-width="1.5"/>`}).join('');
const HERO=k=>sv(600,120,`<defs><linearGradient id=sk x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color=#0b1030 /><stop offset=1 stop-color=#6b2a1c /></linearGradient><radialGradient id=pl><stop offset=0 stop-color=#ffb07a /><stop offset=1 stop-color=#b8432a /></radialGradient></defs><rect width=600 height=120 rx=12 fill=url(#sk) />`+[[30,20],[90,50],[150,15],[220,35],[360,40],[430,18],[560,100]].map(p=>`<circle cx=${p[0]} cy=${p[1]} r=1.6 fill=#fff />`).join('')+`<circle cx=520 cy=40 r=24 fill=url(#pl) /><path d="M0 120V96Q100 70 200 92T380 90T600 84V120Z" fill=#8e3a22 /><path d="M0 120V108Q150 92 300 108T600 104V120Z" fill=#6b2a1c /><g transform="translate(50 82)"><rect width=34 height=10 rx=3 fill=#cfd8f0 /><rect x=22 y=-8 width=3 height=8 fill=#cfd8f0 /><circle cx=23 cy=-10 r=4 fill=#4dd2ff /><circle cx=6 cy=14 r=5 fill=#222 /><circle cx=28 cy=14 r=5 fill=#222 /></g>`+[pie(300,52,34,8,3),'<rect x=280 y=14 width=40 height=76 rx=10 fill=none stroke=#4dd2ff stroke-width=3 /><rect x=284 y=40 width=32 height=46 rx=7 fill=#4dd2ff />','<path d="M300 8Q322 40 316 80H284Q278 40 300 8Z" fill=#e6ecff /><circle cx=300 cy=44 r=7 fill=#4dd2ff /><path d="M284 80L270 96L290 88ZM316 80L330 96L310 88Z" fill=#ff9d4d />','<circle cx=300 cy=52 r=34 fill=#e6ecff /><rect x=278 y=38 width=44 height=26 rx=13 fill=#0b1030 /><circle cx=312 cy=46 r=4 fill=#4dd2ff />'][k-1],'hero');
const FIG={1:()=>sv(300,50,Array.from({length:12},(_,i)=>`<rect x=${i*25+2} y=4 width=20 height=40 rx=6 fill=${i<5?'#4dd2ff':'none'} stroke=#4dd2ff stroke-width=2 />`).join(''),'fig'),
2:()=>sv(300,50,[0,1,2].map(i=>`<rect x=${i*30+4} y=10 width=18 height=34 rx=6 fill=#4dd2ff />`).join('')+[0,1,2,3].map(i=>`<circle cx=${150+i*38} cy=26 r=14 fill=#e6ecff /><rect x=${141+i*38} y=20 width=18 height=10 rx=5 fill=#0b1030 />`).join(''),'fig'),
3:()=>sv(300,58,[0,1,2,3,4].map(i=>`<circle cx=${22+i*44} cy=18 r=15 fill=${i<2?'#4dd2ff':'#ff9d4d'} />`).join('')+'<text x=0 y=54 font-size=11 fill=currentColor>azul: ingenieros · naranja: científicos</text>','fig'),
10:()=>sv(300,56,`<rect x=2 y=4 width=260 height=44 rx=10 fill=none stroke=#4dd2ff stroke-width=3 /><rect x=6 y=8 width=${252*5/6} height=36 rx=7 fill=#4dd2ff />`,'fig')};
const CH=()=>{const c=crit(),ks=Object.keys(c);return sv(600,24*ks.length+6,ks.map((k,i)=>`<text x=0 y=${i*24+16} fill=currentColor font-size=12>${k}</text><rect x=90 y=${i*24+4} width=400 height=14 rx=7 fill=var(--p2) /><rect x=90 y=${i*24+4} width=${c[k]*40} height=14 rx=7 fill=var(--ac) /><text x=500 y=${i*24+16} fill=currentColor font-size=12>${f1(c[k])}</text>`).join(''),'ch')};
const f1=x=>x.toFixed(1).replace('.',',');
const bar=(n,d)=>{let r='';for(let i=0;i<d;i++)r+=`<rect x="${i*300/d+1}" y="2" width="${300/d-2}" height="30" rx="3" fill="${i<n?'var(--ac)':'var(--p2)'}"/>`;return `<svg viewBox="0 0 300 34" class=bar role=img aria-label="${n} de ${d} partes">${r}</svg>`};
function theme(t){S.th=t;document.documentElement.dataset.theme=t;save()}
theme(S.th||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));

function head(){const n=A.filter(done).length;return `<header><div class=top><h1>▲ MISIÓN MARTE · Fracciones</h1><div class=row style="margin:0"><button onclick="theme(S.th=='dark'?'light':'dark');draw()" aria-label="Cambiar tema">◐ Tema</button><button class=pr onclick="pdf()">⇩ Informe PDF</button></div></div>
<div class=pb><i style="width:${n/A.length*100}%"></i></div><div class=st>Completadas ${n}/${A.length} · Nota provisional ${f1(nota())}/10 · ${S.u.n} ${S.u.a} (${S.u.c})</div>
<div class=tabs>${ST.map((x,i)=>{const L=A.filter(q=>q.s==i+1);return `<button class="tab ${S.st==i+1?'on':''}" onclick="S.st=${i+1};save();draw()">Etapa ${i+1}<small>${x} · ${L.filter(done).length}/${L.length}</small></button>`}).join('')}</div></header>`}

function card(q,i){
 if(q.t=='tx')return cTx(q);if(q.t=='lk')return cLk(q);
 const r=R(q.id);let inp='',dis=r.d?'disabled':'';
 if(q.t=='mcq')inp=q.o.map((o,j)=>`<label class=op><input type=radio name=q${q.id} ${r.v===j?'checked':''} ${dis} onchange="R(${q.id}).v=${j};save()">${fr(o)}</label>`).join('');
 if(q.t=='num')inp=q.f.map((f,j)=>`<span class=nf><input type=text inputmode=decimal aria-label="${f}" value="${(r.v||[])[j]??''}" ${dis} oninput="(R(${q.id}).v=R(${q.id}).v||[])[${j}]=this.value;save()"><small class=st>${f}</small></span>`).join('');
 if(q.t=='sl'){const v=r.v??0;inp=`<div id=b${q.id}>${bar(v,q.d)}</div><input type=range min=0 max=${q.d} value=${v} ${dis} style="width:100%;max-width:420px" aria-label="Partes iluminadas" oninput="R(${q.id}).v=+this.value;$('#b${q.id}').innerHTML=bar(+this.value,${q.d});$('#l${q.id}').innerHTML=fr(this.value+'/${q.d}');save()"> <b id=l${q.id}>${fr(v+'/'+q.d)}</b>`}
 return `<section class="card ${r.d?(r.p?'ok':'ko'):''}"><div class=meta><span>Actividad ${i} · ${q.c}</span><span>${r.d?r.p+' pts · ':''}${r.n} intento${r.n==1?'':'s'}</span></div>${(FIG[q.id]||(()=>''))()}<p>${fr(q.q)}</p>${inp}
 <div class=row>${r.d?'':`<button class=pr onclick="chk(${q.id})">Comprobar</button><button onclick="R(${q.id}).h=1;save();draw()">Pista</button>`}</div>
 ${r.h&&!r.d?`<div class=hint>Pista: ${fr(q.h)}</div>`:''}${r.m?`<div class=fb role=status>${r.m}</div>`:''}</section>`}

function chk(id){const q=A.find(x=>x.id==id),r=R(id);if(r.d)return;let ok,m='',v=r.v;
 if(q.t=='mcq'){if(v==null){r.m='Elige una opción antes de comprobar.';return draw()}ok=v==q.k}
 else if(q.t=='sl'){v=v??0;ok=v==q.k}
 else{const x=(v||[]).map(s=>parseFloat(String(s).replace(',','.')));if(x.length<q.f.length||x.some(isNaN)){r.m='Rellena todas las casillas con números.';return draw()}
  if(q.a.length==2){const[n,d]=x;ok=d!=0&&n*q.a[1]==d*q.a[0];if(ok&&q.irr&&gcd(n,d)!=1){ok=0;m='Es una fracción equivalente, pero hay que simplificarla al máximo. '}}else ok=Math.abs(x[0]-q.a[0])<1e-9}
 r.n++;const sol=q.t=='mcq'?q.o[q.k]:q.t=='sl'?q.k+'/'+q.d:q.a.join('/');
 if(ok){r.d=1;r.p=r.n==1?10:6;r.m=`✔ Correcto: +${r.p} puntos. ${q.e}`}
